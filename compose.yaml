services:
  corporate-db:
    image: postgres:15.8-bookworm
    container_name: budimind-corporate-db
    environment:
      POSTGRES_DB: budimind_corporate
      POSTGRES_USER: corporate_app
      POSTGRES_PASSWORD: corporate_dev
    ports:
      - '5432:5432'
    volumes:
      - corporate-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U corporate_app -d budimind_corporate']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - corporate-network

  clinical-db:
    image: postgres:15.8-bookworm
    container_name: budimind-clinical-db
    environment:
      POSTGRES_DB: budimind_clinical
      POSTGRES_USER: clinical_app
      POSTGRES_PASSWORD: clinical_dev
    ports:
      - '5433:5432'
    volumes:
      - clinical-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clinical_app -d budimind_clinical']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - clinical-network

volumes:
  corporate-postgres-data:
  clinical-postgres-data:

networks:
  corporate-network:
    internal: true
  clinical-network:
    internal: true
