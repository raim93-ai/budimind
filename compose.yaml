services:
  corporate-db:
    image: mysql:8.4.6
    container_name: budimind-corporate-db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: budimind_corporate
      MYSQL_USER: corporate_app
      MYSQL_PASSWORD: corporate_dev
      MYSQL_ROOT_PASSWORD: corporate_root_dev
      MYSQL_INITDB_SKIP_TZINFO: '1'
    ports:
      - '3306:3306'
    volumes:
      - corporate-db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u corporate_app -pcorporate_dev --silent']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - corporate-network

  clinical-db:
    image: mysql:8.4.6
    container_name: budimind-clinical-db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: budimind_clinical
      MYSQL_USER: clinical_app
      MYSQL_PASSWORD: clinical_dev
      MYSQL_ROOT_PASSWORD: clinical_root_dev
      MYSQL_INITDB_SKIP_TZINFO: '1'
    ports:
      - '3307:3306'
    volumes:
      - clinical-db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u clinical_app -pclinical_dev --silent']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - clinical-network

volumes:
  corporate-db-data:
  clinical-db-data:

networks:
  corporate-network:
    internal: true
  clinical-network:
    internal: true
