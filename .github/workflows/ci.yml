name: CI

on:
  pull_request:
  push:
    branches: [main, codex/stage-03]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.5
          enable-cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python and dependencies
        run: uv sync --python 3.13 --locked

      - name: Start isolated databases
        run: docker compose up -d --wait

      - name: Verify schemas
        run: pnpm db:migrate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint web source
        run: pnpm lint

      - name: Build web applications
        run: pnpm build

      - name: Typecheck web source
        run: pnpm typecheck

      - name: Test packages
        run: pnpm test

      - name: Test platform contracts
        run: pnpm test:integration

      - name: Lint Python source
        run: pnpm python:lint

      - name: Typecheck Python source
        run: pnpm python:typecheck

      - name: Test Python source
        run: pnpm python:test

      - name: Install browser
        run: pnpm --filter clinic-web exec playwright install --with-deps chromium

      - name: Verify web journeys
        run: pnpm test:e2e

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs
